name: Deploy to GitHub Pages

# One-time setup: in the repository, Settings > Pages > Build and deployment > Source: "GitHub Actions".
# The site is then published at https://<owner>.github.io/<repo>/ on every push to a branch listed below.
on:
  push:
    branches: [main, claude/amazing-rubin-b3305h]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:pages
      - run: cp dist-pages/index.html dist-pages/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages
      - id: deployment
        uses: actions/deploy-pages@v4
