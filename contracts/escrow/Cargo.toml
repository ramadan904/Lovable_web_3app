[package]
name = "fernhill-escrow"
version = "0.1.0"
edition = "2021"
description = "Deposit escrow for Fernhill Mobile Detail, written in Rust for Arbitrum Stylus"
license = "MIT"

[dependencies]
stylus-sdk = "0.10.9"
alloy-sol-types = "1.7.3"

[dev-dependencies]
stylus-sdk = { version = "0.10.9", features = ["stylus-test"] }

[features]
export-abi = ["stylus-sdk/export-abi"]
contract-client-gen = []

[lib]
crate-type = ["lib", "cdylib"]

[[bin]]
name = "fernhill-escrow-abi"
path = "src/main.rs"

[profile.release]
codegen-units = 1
strip = true
lto = true
panic = "abort"
opt-level = "s"
